<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Smart House Control</title>
  <style>
    body{font-family:Arial,sans-serif;max-width:1000px;margin:20px auto;padding:0 12px}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
    .card{border:1px solid #ddd;border-radius:8px;padding:12px}
    button{margin:4px;padding:6px 10px}
    input{padding:6px;margin:4px;width:100px}
    pre{background:#f6f6f6;padding:10px;max-height:340px;overflow:auto}
    iframe{width:100%;height:420px;border:0}
  </style>
</head>
<body>
  <h2>Smart House Dashboard</h2>
  <div class="grid">
    <div class="card">
      <h3>Alarm</h3>
      <button onclick="post('/api/alarm',{action:'on'})">Alarm ON</button>
      <button onclick="post('/api/alarm',{action:'off'})">Alarm OFF</button>
      <div>
        <input id="pin" placeholder="PIN" />
        <button onclick="post('/api/pin',{pin:val('pin')})">Unesi PIN</button>
      </div>
    </div>

    <div class="card">
      <h3>Kuhinjski tajmer (4SD)</h3>
      <input id="timer" type="number" placeholder="sekunde" />
      <button onclick="post('/api/timer',{seconds:Number(val('timer')||0)})">Set</button>
      <div>
        <input id="btnAdd" type="number" placeholder="BTN +N" />
        <button onclick="post('/api/timer/add-seconds',{seconds:Number(val('btnAdd')||30)})">Sačuvaj BTN +N</button>
      </div>
    </div>

    <div class="card">
      <h3>BRGB</h3>
      <button onclick="rgb('RED')">Red</button>
      <button onclick="rgb('GREEN')">Green</button>
      <button onclick="rgb('BLUE')">Blue</button>
      <button onclick="rgb('OFF')">Off</button>
    </div>
  </div>

  <div class="card">
    <h3>Trenutno stanje sistema</h3>
    <pre id="state">Loading...</pre>
  </div>

  {% if grafana_embed %}
  <div class="card">
    <h3>Grafana</h3>
    <iframe src="{{ grafana_embed }}"></iframe>
  </div>
  {% endif %}

<script>
const val = id => document.getElementById(id).value;
async function post(url, body){
  await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  await loadState();
}
function rgb(action){ post('/api/rgb',{action}); }
async function loadState(){
  const r = await fetch('/api/state');
  const j = await r.json();
  document.getElementById('state').textContent = JSON.stringify(j,null,2);
}
setInterval(loadState, 2000); loadState();
</script>
</body>
</html>
